<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay GOL DEL LIBER</title><style>html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}video{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;pointer-events:none}</style></head><body><video id="v" playsinline preload="auto" src="/gol.webm"></video><script>const v=document.querySelector('#v');let ws,timer;function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type!=='gol')return;clearTimeout(timer);v.pause();v.currentTime=0;v.style.opacity='1';try{await v.play()}catch(err){console.log('Reproducción bloqueada por navegador',err);v.style.opacity='0'}timer=setTimeout(()=>{v.pause();v.style.opacity='0'},7100)};ws.onclose=()=>setTimeout(connect,2000)}v.onended=()=>v.style.opacity='0';connect();</script></body></html>
