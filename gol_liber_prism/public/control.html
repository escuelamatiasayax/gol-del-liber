<!doctype html><html lang="es"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Control GOL DEL LIBER</title><style>body{background:#121923;color:white;font-family:system-ui;margin:0;padding:30px;text-align:center}main{max-width:480px;margin:auto}h1{font-size:30px}input{box-sizing:border-box;width:100%;padding:14px;font-size:17px;border-radius:9px;margin:12px 0}button{width:100%;padding:26px;border:0;border-radius:16px;background:#d5222b;color:white;font-weight:900;font-size:27px}button:disabled{opacity:.5}small{color:#bcc6d3}#status{margin:24px}</style></head><body><main><h1>⚽ GOL DEL LIBER</h1><p>Control remoto de la transmisión</p><input type="password" id="token" placeholder="Clave de control" autocomplete="off"><button id="gol" disabled>¡GOOOL DEL LIBER!</button><p id="status">Conectando…</p><small>El Android y el iPhone deben tener conexión a internet. No compartas la clave.</small></main><script>let ws;const status=document.querySelector('#status'),button=document.querySelector('#gol');function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>{status.textContent='Conectado ✓';button.disabled=false};ws.onclose=()=>{status.textContent='Reconectando…';button.disabled=true;setTimeout(connect,2000)};ws.onerror=()=>status.textContent='Error de conexión'}connect();button.onclick=()=>{if(!token.value){status.textContent='Ingresá la clave';return}ws.send(JSON.stringify({type:'gol',token:token.value}));status.textContent='Orden enviada ⚽';button.disabled=true;setTimeout(()=>button.disabled=ws.readyState!==1,1200)};</script></body></html>
